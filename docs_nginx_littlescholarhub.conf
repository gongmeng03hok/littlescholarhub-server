server {
    server_name www.littlescholarhub.com;

    root /var/www/littlescholarhub/lsh.web/dist;
    index index.html;

    # gzip — shrinks the ~2.3MB JS bundle to ~500KB
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        application/javascript application/json application/xml image/svg+xml text/css text/plain text/xml;

    # Content-hashed build assets — filename changes each deploy, so cache forever
    location /_expo/static/ {
        include /etc/nginx/snippets/lsh-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Icons — browsers re-request these on every page view; cache a week.
    location ~ ^/(favicon\.(ico|png)|apple-touch-icon\.png)$ {
        include /etc/nginx/snippets/lsh-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Generated question illustrations. Name-addressed (no content hash), so
    # they cannot be cached forever — a day, then revalidate in the background.
    location /art/ {
        include /etc/nginx/snippets/lsh-headers.conf;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        try_files $uri =404;
    }

    # Other static assets (icons, fonts) — cache a week
    location /assets/ {
        include /etc/nginx/snippets/lsh-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # App shell + SPA routes — ALWAYS revalidate so a new deploy shows up immediately
    # ── lsh-seo ──────────────────────────────────────────────────────────
    # Served as themselves, not swallowed by the SPA fallback below.
    location = /robots.txt {
        include /etc/nginx/snippets/lsh-headers.conf;
        default_type text/plain;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    location = /sitemap.xml {
        include /etc/nginx/snippets/lsh-headers.conf;
        default_type application/xml;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Known app screens: hand back the shell so client-side routing works.
    location ~ ^/(landing|assessment|login|register|forgot-password|reset-password|sample|kid-select|assignments|children|community|content|homework|math|plan|practice|progress|rewards|settings|story|storypacks|weekly-packets|customize|leaderboard|gradebook|students|config|users)(/|$) {
        include /etc/nginx/snippets/lsh-headers.conf;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # The 404 body is the app shell, so a person still lands in a working app —
    # but the status line is honest, which is what a crawler reads.
    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/lsh-headers.conf;
        internal;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        include /etc/nginx/snippets/lsh-headers.conf;
        # Real file, real directory, or an honest 404 — no blanket index.html.
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    # ── /lsh-seo ─────────────────────────────────────────────────────────


    location /api/ {
        include /etc/nginx/snippets/lsh-headers.conf;
        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
        # Nginx's own default (1MB) was rejecting PDF/worksheet uploads with a
        # 413 before Flask ever saw the request. Sized above our largest
        # app-level limit (worksheet upload = 20MB) with headroom.
        client_max_body_size 25M;
    }

    access_log /var/log/nginx/littlescholarhub_access.log;
    error_log  /var/log/nginx/littlescholarhub_error.log;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/littlescholarhub.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/littlescholarhub.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.littlescholarhub.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = littlescholarhub.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name littlescholarhub.com www.littlescholarhub.com;
    return 404; # managed by Certbot
}

# ── lsh-www-redirect ────────────────────────────────────────────────────────
# One canonical hostname. Both names used to answer 200 with the same content,
# which is two indexable copies of every page.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name littlescholarhub.com;

    ssl_certificate     /etc/letsencrypt/live/littlescholarhub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/littlescholarhub.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.littlescholarhub.com$request_uri;
}
